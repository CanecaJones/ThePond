{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Pond{% endblock %} · Jones</title>
<link rel="stylesheet" href="{% static 'pond/css/style.css' %}">
<script>
  (function () {
    var saved = localStorage.getItem("pond-theme") || "dark";
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a class="logo" href="{% url 'pond:home' %}">The Pond</a>

    <nav class="main-nav">
  <a href="{% url 'pond:feed' %}" data-i18n="nav.feed" class="{% if active == 'feed' %}active{% endif %}">Feed</a>
  <a href="{% url 'pond:articles' %}" data-i18n="nav.articles" class="{% if active == 'articles' %}active{% endif %}">Articles</a>
  <a href="{% url 'pond:thoughts' %}" data-i18n="nav.thoughts" class="{% if active == 'thoughts' %}active{% endif %}">Thoughts</a>
  <a href="{% url 'pond:about' %}" data-i18n="nav.about" class="{% if active == 'about' %}active{% endif %}">About</a>
</nav>

    <div class="nav-controls">
  <button id="theme-toggle" class="icon-btn" title="Alternar tema">☾</button>
  <div class="lang-select">
    <button id="lang-btn" class="lang-btn">PT ▼</button>
    <div id="lang-menu" class="lang-menu">
      <button data-lang="en">🇺🇸 English</button>
      <button data-lang="pt">🇧🇷 Português</button>
    </div>
  </div>
</div>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-mark">&gt;_</div>
    <p class="footer-quote" data-i18n="footer.quote">Debugging is twice as hard as writing the code in the first place.</p>
<p class="webring">
  <span class="arrow">←</span>
  <span data-i18n="footer.webring">Um webring pra quem ainda lê man page</span>
  <span class="arrow">→</span>
</p>
    <p class="copyright">© 2026 Jones · <a href="https://github.com/" target="_blank" rel="noopener">I ♥ Code</a></p>
  </div>
</footer>

<script src="{% static 'pond/js/theme.js' %}"></script>
<script src="{% static 'pond/js/lang.js' %}"></script>
</body>
</html>
